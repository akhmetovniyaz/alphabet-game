<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай букву - Alphabet Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Угадай букву!</h1>
            <div class="score-board">
                <div class="score-item correct">
                    <span class="score-label">✅ Правильно:</span>
                    <span id="correct-score" class="score-value">0</span>
                </div>
                <div class="score-item incorrect">
                    <span class="score-label">❌ Неправильно:</span>
                    <span id="incorrect-score" class="score-value">0</span>
                </div>
            </div>
        </header>

        <main class="game-area">
            <div class="image-container">
                <div id="item-image" class="item-image">🍎</div>
                <div id="item-name" class="item-name"></div>
            </div>

            <div class="question">
                <h2>Выбери первую букву английского названия:</h2>
            </div>

            <div id="options-container" class="options-container">
                <!-- Options will be generated by JavaScript -->
            </div>

            <div id="feedback" class="feedback hidden">
                <p id="feedback-text"></p>
            </div>

            <button id="next-button" class="next-button hidden">Следующий →</button>
        </main>

        <footer>
            <button id="reset-button" class="reset-button">🔄 Сбросить счёт</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
